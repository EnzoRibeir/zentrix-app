<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Zentrix — Login com Telegram</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', -apple-system, BlinkMacSystemFont, sans-serif;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            background: linear-gradient(135deg, #274C77 0%, #4471A0 100%);
            color: #fff;
            padding: 20px;
        }

        .container {
            text-align: center;
            max-width: 400px;
            width: 100%;
        }

        .logo {
            width: 72px;
            height: 72px;
            border-radius: 50%;
            background: #fff;
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 0 auto 20px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.2);
        }

        .logo svg {
            width: 36px;
            height: 36px;
        }

        h1 {
            font-size: 2.2rem;
            font-weight: 300;
            letter-spacing: 3px;
            margin-bottom: 8px;
        }

        .subtitle {
            font-size: 0.95rem;
            color: #A3CEF1;
            margin-bottom: 40px;
        }

        .glass-card {
            background: rgba(255, 255, 255, 0.12);
            border: 1px solid rgba(255, 255, 255, 0.25);
            border-radius: 20px;
            padding: 36px 28px;
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
        }

        .card-title {
            font-size: 1.15rem;
            font-weight: 500;
            margin-bottom: 8px;
        }

        .card-description {
            font-size: 0.85rem;
            color: rgba(255, 255, 255, 0.75);
            line-height: 1.6;
            margin-bottom: 28px;
        }

        /* Container do widget do Telegram */
        #telegram-widget-container {
            display: flex;
            justify-content: center;
            min-height: 50px;
        }

        .security-note {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 6px;
            margin-top: 24px;
            font-size: 0.72rem;
            color: rgba(255, 255, 255, 0.4);
        }

        .security-note svg {
            width: 14px;
            height: 14px;
            flex-shrink: 0;
        }

        /* Loading state */
        .loading {
            display: none;
            flex-direction: column;
            align-items: center;
            gap: 16px;
            padding: 20px;
        }

        .loading.active {
            display: flex;
        }

        .spinner {
            width: 36px;
            height: 36px;
            border: 3px solid rgba(255, 255, 255, 0.3);
            border-top-color: #fff;
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
        }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }

        .loading-text {
            font-size: 0.9rem;
            color: rgba(255, 255, 255, 0.8);
        }
    </style>
</head>
<body>
    <div class="container">
        <!-- Logo -->
        <div class="logo">
            <svg viewBox="0 0 24 24" fill="none" stroke="#274C77" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
                <polyline points="22 7 13.5 15.5 8.5 10.5 2 17"></polyline>
                <polyline points="16 7 22 7 22 13"></polyline>
            </svg>
        </div>

        <h1>Zentrix</h1>
        <p class="subtitle">Controle Financeiro Inteligente</p>

        <!-- Glass Card -->
        <div class="glass-card">
            <p class="card-title">Conecte sua conta</p>
            <p class="card-description">
                Clique no botão abaixo para entrar com sua conta do Telegram.
                Cada conta é única e seus dados ficam isolados e seguros.
            </p>

            <!-- Widget oficial do Telegram Login -->
            <div id="telegram-widget-container">
                <!--
                    ============================================================
                    IMPORTANTE: Substitua "SEU_BOT_USERNAME" pelo username
                    real do seu bot no Telegram (sem o @).
                    
                    Exemplo: data-telegram-login="zentrix_financas_bot"
                    ============================================================
                -->
                <script async
                    src="https://telegram.org/js/telegram-widget.js?22"
                    data-telegram-login="ZentrixOFCBot"
                    data-size="large"
                    data-radius="14"
                    data-onauth="onTelegramAuth(user)"
                    data-request-access="write">
                </script>
            </div>

            <!-- Loading state (exibido após clicar) -->
            <div class="loading" id="loading-state">
                <div class="spinner"></div>
                <span class="loading-text">Autenticando com o Telegram...</span>
            </div>

            <div class="security-note">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"/>
                </svg>
                <span>Autenticação verificada via assinatura criptográfica do Telegram</span>
            </div>
        </div>
    </div>

    <script>
        /**
         * Callback chamado pelo widget do Telegram após o usuário se autenticar.
         * 
         * Recebe os dados assinados pelo Telegram:
         * - id: Telegram User ID (único por pessoa)
         * - first_name, last_name, username, photo_url
         * - auth_date: timestamp da autenticação
         * - hash: HMAC-SHA256 para validação pelo backend
         * 
         * Redireciona para o deep link do app Zentrix com todos os dados.
         */
        function onTelegramAuth(user) {
            // Mostra loading
            document.getElementById('telegram-widget-container').style.display = 'none';
            document.getElementById('loading-state').classList.add('active');

            // Monta a URL de callback com todos os dados do Telegram
            const params = new URLSearchParams();
            
            // Adiciona cada campo do usuário como query parameter
            for (const [key, value] of Object.entries(user)) {
                if (value !== undefined && value !== null) {
                    params.append(key, value);
                }
            }

            // Redireciona para o deep link do app
            // O WebBrowser.openAuthSessionAsync() do Expo captura essa URL
            const callbackUrl = `zentrix://auth/callback?${params.toString()}`;
            
            // Pequeno delay para mostrar o loading
            setTimeout(() => {
                window.location.href = callbackUrl;
            }, 500);
        }
    </script>
</body>
</html>
